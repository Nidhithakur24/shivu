<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Royal Decree of Lord Gandapti</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --maroon: #6E1423;
    --maroon-deep: #430D14;
    --gold: #E8B93B;
    --gold-bright: #FFD873;
    --marigold: #FF8F1F;
    --cream: #FFF3DC;
    --ink: #2B0E0E;
  }

  *{box-sizing:border-box; margin:0; padding:0;}

  html,body{
    height:100%;
    background:
      radial-gradient(ellipse at 50% -10%, #8C1F34 0%, var(--maroon) 45%, var(--maroon-deep) 100%);
    font-family:'Baloo 2', sans-serif;
    overflow-x:hidden;
    color:var(--cream);
    position:relative;
  }

  #coinCanvas{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:5;
  }

  .stage{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:32px 20px 60px;
    position:relative;
    z-index:2;
  }

  /* ambient marigold garland dots along top */
  .garland{
    position:fixed;
    top:0; left:0; right:0;
    height:34px;
    display:flex;
    justify-content:space-evenly;
    align-items:flex-start;
    z-index:3;
    pointer-events:none;
  }
  .garland span{
    width:16px; height:16px;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%, var(--gold-bright), var(--marigold) 70%);
    box-shadow:0 6px 10px rgba(0,0,0,.35);
    animation:sway 2.4s ease-in-out infinite;
  }
  .garland span:nth-child(even){animation-delay:.4s;}
  .garland span:nth-child(3n){animation-delay:.8s;}
  @keyframes sway{
    0%,100%{transform:translateY(0) rotate(0deg);}
    50%{transform:translateY(6px) rotate(4deg);}
  }

  .eyebrow{
    font-size:13px;
    letter-spacing:.35em;
    text-transform:uppercase;
    color:var(--gold);
    opacity:.85;
    margin-bottom:14px;
    text-align:center;
  }

  h1.title{
    font-family:'Cinzel Decorative', serif;
    font-weight:900;
    text-align:center;
    line-height:1.05;
    font-size:clamp(2rem, 7vw, 4.2rem);
    background:linear-gradient(180deg, var(--gold-bright) 0%, var(--gold) 55%, var(--marigold) 100%);
    -webkit-background-clip:text;
    background-clip:text;
    -webkit-text-fill-color:transparent;
    text-shadow:0 2px 0 rgba(0,0,0,.15);
    margin-bottom:6px;
    max-width:900px;
  }

  .subtitle{
    text-align:center;
    font-size:clamp(.95rem, 2.4vw, 1.15rem);
    color:var(--cream);
    opacity:.85;
    max-width:480px;
    margin-bottom:38px;
  }

  .subtitle .guj{
    display:block;
    color:var(--gold-bright);
    font-weight:700;
    margin-top:4px;
  }

  /* the royal seal button */
  .seal-wrap{
    position:relative;
    width:180px;
    height:180px;
    margin-bottom:10px;
  }

  .seal{
    width:100%;
    height:100%;
    border-radius:50%;
    border:4px solid var(--gold);
    background:
      repeating-conic-gradient(from 0deg, var(--marigold) 0deg 8deg, var(--gold) 8deg 16deg);
    box-shadow:
      0 0 0 8px var(--maroon-deep),
      0 0 0 11px var(--gold),
      0 20px 40px rgba(0,0,0,.5);
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    animation:pulse 2.6s ease-in-out infinite;
    transition:transform .25s ease;
  }
  .seal:hover{transform:scale(1.05) rotate(4deg);}
  .seal:active{transform:scale(.96);}

  @keyframes pulse{
    0%,100%{box-shadow:0 0 0 8px var(--maroon-deep), 0 0 0 11px var(--gold), 0 20px 40px rgba(0,0,0,.5), 0 0 0 rgba(255,143,31,0);}
    50%{box-shadow:0 0 0 8px var(--maroon-deep), 0 0 0 11px var(--gold), 0 20px 40px rgba(0,0,0,.5), 0 0 26px 6px rgba(255,143,31,.55);}
  }

  .seal-inner{
    width:70%;
    height:70%;
    border-radius:50%;
    background:radial-gradient(circle at 40% 35%, #FFE4A3, var(--gold) 60%, var(--marigold) 100%);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:2.6rem;
    box-shadow:inset 0 4px 10px rgba(0,0,0,.25);
  }

  .tap-hint{
    font-size:.85rem;
    letter-spacing:.08em;
    color:var(--gold);
    opacity:.75;
    margin-bottom:44px;
    animation:blink 1.8s ease-in-out infinite;
  }
  @keyframes blink{0%,100%{opacity:.4;}50%{opacity:.9;}}

  /* burst name */
  .burst-name{
    position:fixed;
    top:50%; left:50%;
    transform:translate(-50%,-50%) scale(0);
    font-family:'Cinzel Decorative', serif;
    font-weight:900;
    font-size:clamp(3rem, 14vw, 8rem);
    color:var(--gold-bright);
    text-shadow:
      0 0 20px var(--marigold),
      0 0 60px rgba(255,143,31,.8),
      0 6px 0 var(--maroon-deep);
    z-index:20;
    pointer-events:none;
    white-space:nowrap;
  }
  .burst-name.go{
    animation:nameBurst 1.4s cubic-bezier(.2,1.4,.4,1) forwards;
  }
  @keyframes nameBurst{
    0%{transform:translate(-50%,-50%) scale(0) rotate(-8deg); opacity:0;}
    55%{transform:translate(-50%,-50%) scale(1.15) rotate(2deg); opacity:1;}
    75%{transform:translate(-50%,-50%) scale(1) rotate(0deg); opacity:1;}
    100%{transform:translate(-50%,-70%) scale(.42) rotate(0deg); opacity:1;}
  }

  /* certificate */
  .certificate{
    max-width:560px;
    width:100%;
    background:
      linear-gradient(180deg, var(--cream), #FBE7BE);
    color:var(--ink);
    border-radius:14px;
    padding:34px 30px 30px;
    text-align:center;
    position:relative;
    opacity:0;
    transform:translateY(40px) scale(.94);
    box-shadow:0 30px 60px rgba(0,0,0,.45);
    border:3px solid var(--gold);
    z-index:10;
  }
  .certificate.show{
    animation:certRise .9s cubic-bezier(.16,1,.3,1) forwards;
    animation-delay:.9s;
  }
  @keyframes certRise{
    to{opacity:1; transform:translateY(0) scale(1);}
  }

  .certificate::before, .certificate::after{
    content:"";
    position:absolute;
    top:10px; bottom:10px;
    width:6px;
    background:repeating-linear-gradient(180deg, var(--gold) 0 10px, var(--marigold) 10px 20px);
    border-radius:4px;
  }
  .certificate::before{left:10px;}
  .certificate::after{right:10px;}

  .cert-crown{font-size:2.2rem; margin-bottom:10px;}

  .cert-photo-wrap{
    width:120px;
    height:120px;
    margin:0 auto 16px;
    border-radius:50%;
    padding:5px;
    background:conic-gradient(var(--gold), var(--marigold), var(--gold-bright), var(--gold));
    box-shadow:0 10px 22px rgba(0,0,0,.25);
  }
  .cert-photo{
    width:100%;
    height:100%;
    object-fit:cover;
    border-radius:50%;
    display:block;
    border:3px solid var(--cream);
  }
  .cert-photo-wrap.no-photo{
    background:conic-gradient(var(--gold), var(--marigold), var(--gold-bright), var(--gold));
  }
  .cert-photo-wrap.no-photo .cert-photo{
    display:none;
  }
  .cert-photo-wrap.no-photo::after{
    content:"👑";
    display:flex;
    align-items:center;
    justify-content:center;
    width:100%;
    height:100%;
    font-size:2.6rem;
    background:radial-gradient(circle at 40% 35%, #FFE4A3, var(--gold) 60%, var(--marigold) 100%);
    border-radius:50%;
    border:3px solid var(--cream);
  }

  .cert-name{
    font-family:'Cinzel Decorative', serif;
    font-weight:900;
    font-size:clamp(1.8rem, 5.5vw, 2.5rem);
    color:var(--maroon);
    margin-bottom:14px;
  }

  .cert-note{
    font-size:.95rem;
    line-height:1.55;
    color:#7A3A00;
    font-weight:700;
    max-width:400px;
    margin:0 auto 22px;
  }

  .stat-row{
    display:flex;
    justify-content:center;
    gap:22px;
    flex-wrap:wrap;
    margin-bottom:20px;
  }
  .stat{
    background:rgba(110,20,35,.06);
    border:1px solid rgba(110,20,35,.15);
    border-radius:10px;
    padding:10px 16px;
    min-width:110px;
  }
  .stat .num{
    font-family:'Cinzel Decorative', serif;
    font-weight:700;
    font-size:1.3rem;
    color:var(--maroon);
    display:block;
  }
  .stat .lbl{
    font-size:.68rem;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:#8C4A00;
  }

  .seal-stamp{
    font-size:.72rem;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:#8C4A00;
    opacity:.7;
  }

  .replay-btn{
    margin-top:22px;
    background:linear-gradient(180deg, var(--marigold), #E06E00);
    color:#fff;
    border:none;
    padding:12px 26px;
    border-radius:999px;
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:.95rem;
    letter-spacing:.03em;
    cursor:pointer;
    box-shadow:0 8px 18px rgba(224,110,0,.4);
    transition:transform .2s ease;
    opacity:0;
  }
  .replay-btn.show{
    animation:fadeIn .6s ease forwards;
    animation-delay:1.6s;
  }
  @keyframes fadeIn{to{opacity:1;}}
  .replay-btn:hover{transform:translateY(-2px);}
  .replay-btn:active{transform:translateY(0);}

  .hidden{display:none;}

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important;}
  }
</style>
</head>

    </div>

    <div class="cert-name">SHIVU GANPATI 🙃🙃</div>

    <div class="stat-row">
      <div class="stat"><span class="num">👑</span><span class="lbl">Title</span></div>
      <div class="stat"><span class="num">💰</span><span class="lbl">Loot Secured</span></div>
      <div class="stat"><span class="num">100%</span><span class="lbl">Swag</span></div>
    </div>

    <div class="seal-stamp">by Nidhi didi</div>
  </div>

  <button class="replay-btn" id="replayBtn">Summon again ✨</button>
</div>

<script>
  // garland dots
  const garland = document.getElementById('garland');
  for(let i=0;i<16;i++){
    const s = document.createElement('span');
    garland.appendChild(s);
  }

  const canvas = document.getElementById('coinCanvas');
  const ctx = canvas.getContext('2d');
  function resize(){
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  const emojiSet = ['🪙','💰','✨','👑'];
  let particles = [];

  function spawnBurst(count){
    for(let i=0;i<count;i++){
      particles.push({
        x: canvas.width/2 + (Math.random()-0.5)*60,
        y: canvas.height*0.35,
        vx: (Math.random()-0.5) * 9,
        vy: -(Math.random()*10 + 6),
        gravity: 0.28 + Math.random()*0.12,
        rot: Math.random()*360,
        vr: (Math.random()-0.5) * 14,
        size: 18 + Math.random()*16,
        emoji: emojiSet[Math.floor(Math.random()*emojiSet.length)],
        life: 0,
        maxLife: 220 + Math.random()*60
      });
    }
  }

  function spawnRain(count){
    for(let i=0;i<count;i++){
      particles.push({
        x: Math.random()*canvas.width,
        y: -20 - Math.random()*canvas.height*0.5,
        vx: (Math.random()-0.5)*1.5,
        vy: 2 + Math.random()*3,
        gravity: 0.02,
        rot: Math.random()*360,
        vr: (Math.random()-0.5)*6,
        size: 16 + Math.random()*14,
        emoji: emojiSet[Math.floor(Math.random()*emojiSet.length)],
        life: 0,
        maxLife: 500
      });
    }
  }

  function loop(){
    ctx.clearRect(0,0,canvas.width, canvas.height);
    particles.forEach(p=>{
      p.vy += p.gravity;
      p.x += p.vx;
      p.y += p.vy;
      p.rot += p.vr;
      p.life++;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot * Math.PI/180);
      ctx.font = p.size + 'px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      const fade = p.life > p.maxLife*0.75 ? Math.max(0, 1 - (p.life - p.maxLife*0.75)/(p.maxLife*0.25)) : 1;
      ctx.globalAlpha = fade;
      ctx.fillText(p.emoji, 0, 0);
      ctx.restore();
    });
    particles = particles.filter(p => p.life < p.maxLife && p.y < canvas.height + 60);
    requestAnimationFrame(loop);
  }
  loop();

  let rainInterval = null;
  let audioCtx = null;

  function playFanfare(){
    try{
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      if(audioCtx.state === 'suspended') audioCtx.resume();

      const now = audioCtx.currentTime;
      // ascending royal arpeggio
      const notes = [523.25, 659.25, 783.99, 1046.50, 1318.51]; // C5 E5 G5 C6 E6
      notes.forEach((freq, i)=>{
        const t = now + i*0.11;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, t);
        gain.gain.setValueAtTime(0, t);
        gain.gain.linearRampToValueAtTime(0.22, t + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.45);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(t);
        osc.stop(t + 0.5);
      });

      // sparkly coin dings scattered over the next couple seconds
      for(let i=0;i<10;i++){
        const t = now + 0.5 + Math.random()*2.2;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        const freq = 1500 + Math.random()*900;
        osc.frequency.setValueAtTime(freq, t);
        gain.gain.setValueAtTime(0, t);
        gain.gain.linearRampToValueAtTime(0.08, t + 0.01);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.25);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(t);
        osc.stop(t + 0.3);
      }
    }catch(e){ /* audio not supported, silently skip */ }
  }

  function playSurprise(){
    playFanfare();
    const ganpatiAudio = document.getElementById('ganpatiAudio');
    if(ganpatiAudio){
      ganpatiAudio.currentTime = 0;
      ganpatiAudio.play().catch(()=>{});
    }
    spawnBurst(40);
    if(rainInterval) clearInterval(rainInterval);
    rainInterval = setInterval(()=> spawnRain(6), 180);
    setTimeout(()=>{ if(rainInterval){ clearInterval(rainInterval); rainInterval=null; } }, 4200);

    // burst name
    const existingBurst = document.querySelector('.burst-name');
    if(existingBurst) existingBurst.remove();
    const nameEl = document.createElement('div');
    nameEl.className = 'burst-name';
    nameEl.textContent = 'SHIVU!';
    document.body.appendChild(nameEl);
    requestAnimationFrame(()=> nameEl.classList.add('go'));

    document.getElementById('tapHint').style.display = 'none';
    document.getElementById('sealBtn').style.pointerEvents = 'none';

    const cert = document.getElementById('certificate');
    cert.classList.remove('show');
    void cert.offsetWidth;
    cert.classList.add('show');

    const replay = document.getElementById('replayBtn');
    replay.classList.remove('show');
    void replay.offsetWidth;
    replay.classList.add('show');
  }

  document.getElementById('sealBtn').addEventListener('click', playSurprise);
  document.getElementById('replayBtn').addEventListener('click', playSurprise);
</script>
